name: CI Pipeline - Automatización de Pruebas

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Pruebas Unitarias y Validación
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código del repositorio (Checkout)
      uses: actions/checkout@v4

    - name: 2. Configurar entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Ejecutar pruebas unitarias automatizadas
      run: |
        python -m unittest test_gestion_academica.py -v

    - name: 5. Validar ejecución del programa principal
      run: |
        python main.py
